<div class="page-bg">

    <h2 class="form-title">படிவம் 4</h2>
    <div class="form-subtitle">வேட்புமனு தாக்கல் பற்றிய விபரங்கள்</div>

    <!-- F1 & F2 -->
    <div class="row">
        <div class="col">
            <label>மாவட்ட தேர்தல் அலுவலர்/ மாவட்டம்
            </label>
            <input class="input-box" [(ngModel)]="district_name" readonly />
        </div>
        <div class="col">
            <label>மாவட்ட தேர்தல் அலுவலர்/ சரகம்</label>
            <input class="input-box" [(ngModel)]="zone_name" readonly />
        </div>
    </div>

    <!-- F3 -->
    <label class="section-label">தேர்தல் அறிவிப்பின்படி வேட்புமனு தாக்கல் நடைபெற வேண்டிய சங்கங்கள் மற்றும்
        தேர்ந்தெடுக்கப்பட வேண்டிய நிர்வாகக்குழு உறுப்பினர்களின் எண்ணிக்கை
    </label>
    <div class="large-box">
        <div class="f4-row" *ngFor="let soc of societyList">
            <div class="f4-name">
                <input type="checkbox" [(ngModel)]="soc.selected" (change)="onSelectChange()" />
                {{ soc.society_name }}
            </div>

            <div class="f4-input-group"><span class="f4-label">ப.தி./ப.கு
                </span><input class="f4-input" [value]="soc.sc_st" readonly /></div>
            <div class="f4-input-group"><span class="f4-label">மகளிர்</span><input class="f4-input" [value]="soc.women"
                    readonly /></div>
            <div class="f4-input-group"><span class="f4-label">பொது</span><input class="f4-input" [value]="soc.general"
                    readonly /></div>
            <div class="f4-input-group">
                <span class="f4-label">மொத்தம்</span>
                <input class="f4-input" [value]="soc.total" readonly />
            </div>

        </div>
    </div>
    <br>

    <!-- F4 -->
    <label class="section-label">வேட்புமனு தாக்கல் செய்யப்பட்ட சங்கங்கள் மற்றும் வேட்பாளர்களின் எண்ணிக்கை
    </label>

    <div class="large-box" *ngIf="selectedSocietyList.length; else empty">
        <div class="f4-row" *ngFor="let soc of selectedSocietyList">

            <div class="f4-name">✔ {{ soc.society_name }}</div>

            <!-- MANUAL INPUTS -->
            <div class="f4-input-group">
                <span class="f4-label">ப.தி./ப.கு</span>
                <input type="number" class="f4-input" min="0" [(ngModel)]="soc.declared_sc_st" />
            </div>

            <div class="f4-input-group">
                <span class="f4-label">மகளிர்</span>
                <input type="number" class="f4-input" min="0" [(ngModel)]="soc.declared_women" />
            </div>

            <div class="f4-input-group">
                <span class="f4-label">பொது</span>
                <input type="number" class="f4-input" min="0" [(ngModel)]="soc.declared_general" />
            </div>

            <!-- STOPPED -->
            <!-- <div class="checkbox-group">
                <input type="checkbox" [(ngModel)]="soc.electionStopped" />
                தேர்தல் நிறுத்தப்பட்டிருப்பின் (✓) செய்யவும்
            </div> -->

            <!-- REMARKS -->
            <!-- <div class="f4-input-group">
                <span class="f4-label">குறிப்புகள்</span>
                <input class="f4-input" [(ngModel)]="soc.remarks" />
            </div> -->

            <!-- <div class="f4-input-group">
                <span class="f4-label">குறிப்புகள்</span>
                <textarea class="f4-input textarea-large" [(ngModel)]="soc.remarks"></textarea>
            </div> -->


        </div>
    </div>
    <br>

    <ng-template #empty>
        <div class="large-box empty-text">எந்த சங்கமும் தேர்வு செய்யப்படவில்லை</div>
    </ng-template>
    <label class="section-label">
        வேட்பு மனு தாக்கல் நடைபெறாத சங்கங்களின் பெயர் மற்றும் காரணம் </label>
    <div class="unselected-box" *ngIf="unselectedSocietyList.length">

        <div *ngFor="let soc of unselectedSocietyList" class="unselected-item unselected-reason-row">

            <span class="unselected-name">{{ soc.society_name }}</span>

            <select class="reason-dropdown" [(ngModel)]="soc.reason" [name]="'reason-' + soc.society_id">
                <option value="" disabled selected hidden>காரணம் தேர்வு செய்யவும்</option>
                <option *ngFor="let r of reasonOptions" [value]="r.value">{{ r.label }}</option>
            </select>

            <textarea *ngIf="soc.reason === 'other'" class="other-reason-box" [(ngModel)]="soc.otherReasonText"
                [name]="'otherReason-' + soc.society_id" maxlength="555"
                placeholder="காரணத்தை உள்ளிடவும் (அதிகபட்சம் 555 எழுத்துகள்)"></textarea>

        </div>

    </div>

    <!-- BUTTONS -->
    <div class="button-row">
        <button class="cancel-btn" (click)="cancel()">ரத்து செய்ய</button>
        <button class="submit-btn" (click)="submit()">சமர்ப்பிக்க</button>
    </div>

</div>
