<div class="step-container">

  <h2 class="title">படிவம் 1</h2>
  <h3 class="sub-title">மாவட்ட தேர்தல் அலுவலரால் தேர்தல் அறிவிப்பு வழங்கப்பட்ட விவரம்</h3>

  <div class="form-grid">
    <div class="form-column">
      <label class="label">மாநில தேர்தல் அலுவலர்</label>
      <input type="text" class="input-box" [(ngModel)]="department_name" readonly>

      <label class="label">மாவட்ட தேர்தல் அலுவலர் சரகம்</label>
      <input type="text" class="input-box" [(ngModel)]="zone_name" readonly>

    </div>

    <div class="form-column">
      <label class="label">மாவட்ட தேர்தல் அலுவலர் மாவட்டம்/மண்டலம்</label>
      <input type="text" class="input-box" [(ngModel)]="district_name" readonly>


      <!-- <label class="label">தேர்தல் ஆணையத்தால் தேர்தல் திட்டம் வழங்கப்பட்ட சங்கங்களின் பெயர்</label> -->
      <label class="label">மாநில தேர்தல் அலுவலரால் திட்டம் கோரப்பட்ட சங்கங்கள்


      </label>

      <!-- <textarea class="textarea-box" [(ngModel)]="masterZonesText" readonly></textarea> -->
      <div class="society-list-box">
        <div *ngFor="let item of masterZones12" class="society-item">
          {{ item.name }}
        </div>
      </div>





    </div>
  </div>

  <div class="form-grid">
    <div class="form-column">
      <label class="label">மாநில தேர்தல் அலுவலரால் திட்டம் கோரப்பட்ட சங்கங்களின் எண்ணிக்கை</label>
      <input type="text" class="input-box" [(ngModel)]="plannedSocietiesCount" readonly>
    </div>

    <div class="form-column">
      <!-- <label class="label">மாவட்ட தேர்தல் அலுவலரால் தேர்தல் அறிவிப்பு வழங்கப்பட்ட சங்கங்களின் பெயர்</label> -->
      <label class="label">மாவட்ட தேர்தல் அலுவலரால் தேர்தல் அறிவிப்பு வழங்கப்பட்ட சங்கங்களின் பெயர்கள்


      </label>

      <div class="checkbox-list">
        <div *ngFor="let item of masterZones12; let i=index" class="checkbox-item">
          <input type="checkbox" [(ngModel)]="item.selected" (change)="onCheckboxChange()" [disabled]="isLoadingDetails"
            [name]="'z'+i">
          {{ item.name }}
        </div>
      </div>
    </div>
  </div>

  <label class="label">
    மாவட்ட தேர்தல் அலுவலரால் தேர்தல் அறிவிப்பு வழங்கப்பட்ட சங்கங்களின் எண்ணிக்கை
  </label>

  <!-- <input type="text" class="input-box" [value]="ruralDetails.length" readonly> -->
  <input type="text" class="input-box" [value]="selectedCount" readonly>


  <!-- <h3 class="label">நிர்வாகக்குழு உறுப்பினர்களின் எண்ணிக்கை
  </h3>
  <table *ngIf="ruralDetails.length>0" class="society-table">
    <thead>
      <tr>
        <th>பெயர்</th>
        <th>ப.இ./ப.கு</th>
        <th>மகளிர்</th>
        <th>பொது</th>
        <th>மொத்தம்</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of ruralDetails">
        <td>{{r.name}}</td>
        <td><input type="number" [(ngModel)]="r.sc" readonly></td>
        <td><input type="number" [(ngModel)]="r.women" readonly></td>
        <td><input type="number" [(ngModel)]="r.general" readonly></td>
        <td><input type="number" [value]="r.sc+r.women+r.general" readonly></td>
      </tr>
    </tbody>
  </table> -->


  <h3 class="label">தேர்ந்தெடுக்கப்பட வேண்டிய நிர்வாகக்குழு உறுப்பினர்களின் எண்ணிக்கை

  </h3>

  <div class="table-responsive" *ngIf="ruralDetails.length > 0">

    <table class="society-table">
      <thead>
        <tr>
          <th>பெயர்</th>
          <th>ப.இ./ப.கு</th>
          <th>மகளிர்</th>
          <th>பொது</th>
          <th>மொத்தம்</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of ruralDetails">
          <td>{{ r.name }}</td>
          <td><input type="number" [(ngModel)]="r.sc" readonly></td>
          <td><input type="number" [(ngModel)]="r.women" readonly></td>
          <td><input type="number" [(ngModel)]="r.general" readonly></td>
          <td><input type="number" [value]="r.sc + r.women + r.general" readonly></td>
        </tr>
      </tbody>

    </table>

  </div>
  <br>
  <h4 class="label">
    தேர்தல் அறிவிப்பு வழங்கப்படாத சங்கங்களின் பெயர்கள்


  </h4>

  <div class="unselected-box" *ngIf="unselectedList.length > 0">
    <div *ngFor="let item of unselectedList" class="unselected-item unselected-reason-row">

      <span class="unselected-name">{{ item.name }}</span>

      <select class="reason-dropdown" [(ngModel)]="item.reason" [name]="'reason-' + item.name">
        <option value="" disabled selected hidden>காரணம் தேர்வு செய்யவும்</option>
        <option *ngFor="let r of reasonOptions" [value]="r.value">{{ r.label }}</option>
      </select>

      <textarea *ngIf="item.reason === 'other'" class="other-reason-box" [(ngModel)]="item.otherReasonText"
        [name]="'otherReason-' + item.name" maxlength="555"
        placeholder="காரணத்தை உள்ளிடவும் (அதிகபட்சம் 555 எழுத்துகள்)"></textarea>

    </div>
  </div>
  <br>


  <div class="form-actions">
    <button class="button-box cancel" (click)="cancel()">
      ரத்து
    </button>
    <!-- <button class="button-box submit" (click)="submitForm()">சமர்ப்பிக்க</button> -->

    <button class="button-box submit" (click)="submitForm()">
      {{ isEditMode ? 'புதுப்பிக்கவும்' : 'சமர்ப்பிக்க' }}
    </button>

  </div>

</div>
