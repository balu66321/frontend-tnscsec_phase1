<div class="step-container">

  <h2 class="title">படிவம் 2</h2>
  <h3 class="sub-title">உறுப்பினர் பட்டியல் அளித்த/அளிக்காத சங்கங்கள் விவரம்</h3>

  <!-- =============== ROW 1 =============== -->
  <div class="form-grid">

    <!-- LEFT COLUMN -->
    <div class="form-column">

      <label class="label">மாவட்ட தேர்தல் அலுவலர் மாவட்டம்/மண்டலம்
      </label>
      <input type="text" class="input-box" [(ngModel)]="district_name" readonly>

      <label class="label">உறுப்பினர் பட்டியல் தயாரித்து வெளியிட வேண்டிய சங்கங்களின் பெயர்
      </label>

      <!-- <textarea class="textarea-box" readonly>{{ f3List }}</textarea> -->

      <div class="society-list-box">
        <div *ngFor="let item of finalCheckboxList" class="society-item">
          {{ item.society_name }}
        </div>
      </div>



    </div>


    <!-- RIGHT COLUMN -->
    <div class="form-column">

      <label class="label">மாவட்ட தேர்தல் அலுவலர்/ சரகம்</label>
      <input type="text" class="input-box" [(ngModel)]="zone_name" readonly>

      <label class="label">உறுப்பினர் பட்டியல் தயாரித்து வெளியிட்டுள்ள சங்கங்களின் பெயர்
      </label>

      <div class="checkbox-list">
        <div *ngFor="let item of finalCheckboxList" class="checkbox-item">
          <!-- <input type="checkbox" [checked]="item.checked" (change)="toggleCheckbox(item)"> -->
          <input type="checkbox" [(ngModel)]="item.checked" (ngModelChange)="updateF5F6()">
          {{ item.society_name }}
        </div>
      </div>

    </div>

  </div>



  <!-- =============== COUNT FIELD =============== -->
  <label class="label">வாக்காளர் பட்டியல் அலுவலருக்கு உறுப்பினர் பட்டியல் அளிக்காத சங்கங்களின் எண்ணிக்கை</label>
  <input type="text" class="input-box" readonly [value]="f6_unselectedList.length">


  <!-- =============== EXTRA COUNT FIELD 1 : PREPARED FROM MEMBER LIST =============== -->
  <label class="label">உறுப்பினர் பட்டியல் அடிப்படையில் வாக்காளர் பட்டியல் அலுவலர் வாக்காளர் பட்டியல் தயாரித்த
    சங்கங்கள்</label>
  <div class="society-list-box">
    <div *ngFor="let item of f5_selectedList" class="society-item count-item">
      <span class="count-item-name">{{ item.society_name }}</span>
      <input type="number" min="0" class="input-box count-input" [(ngModel)]="item.voter_list_prepared_count">
    </div>
  </div>


  <!-- =============== EXTRA COUNT FIELD 2 : PREPARED BY OFFICER HIMSELF =============== -->
  <label class="label">உறுப்பினர் பட்டியல் தயாரிக்காத சங்கங்களில் வாக்காளர் பட்டியல் அலுவலர் அவராகவே வாக்காளர் பட்டியல்
    தயாரித்த சங்கங்கள்</label>
  <div class="society-list-box">
    <div *ngFor="let item of f6_unselectedList" class="society-item count-item">
      <span class="count-item-name">{{ item.society_name }}</span>
      <input type="number" min="0" class="input-box count-input" [(ngModel)]="item.voter_list_prepared_count">
    </div>
  </div>



  <!-- =============== BUTTONS =============== -->

  <div class="form-actions">
    <button class="button-box cancel" (click)="cancel()">
      ரத்து
    </button> <button class="button-box submit" (click)="submitForm2()">சமர்ப்பிக்க</button>
  </div>
</div>
