<div class="forms-container">
    <div class="forms-inner">

        <div class="election-programme-bar">
            <a [routerLink]="['/layout/electionschedule']">
                தேர்தல் அட்டவணை (Election Schedule)
            </a>
            <!-- <a [routerLink]="['/layout/electionprogramme']">
            தேர்தல் திட்ட அறிவிப்பு (Election Programme)
        </a> -->s
        </div>

        <table class="forms-table">

            <tr *ngFor="let f of formsList">

                <!-- Form Name (NOT clickable) -->
                <td class="title">
                    {{ f.title }}
                </td>

                <!-- Arrow Click → Table Page -->
                <td class="link">
                    <a [routerLink]="f.tableLink" class="arrow-link">
                        →
                    </a>
                </td>

            </tr>

        </table>

    </div>
</div>
